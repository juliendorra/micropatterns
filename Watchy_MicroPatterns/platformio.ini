; Micropatterns on Watchy 2.0
;
; Hardware identified in docs/analysis/watchy-hardware-and-references.md:
; ESP32-PICO-D4 (classic ESP32, dual core, NO PSRAM), 200x200 1bpp SSD1681 /
; GDEH0154D67 panel. That rules out the Watchy 3.0 (ESP32-S3) and Yatchy
; (ESP32-C6) variants, so this file carries one environment rather than the
; six-way board matrix InkWatchy maintains.
;
; The renderer, parser, runtime, matrix utils and occlusion buffer are compiled
; STRAIGHT OUT OF the M5Paper tree -- not copied. They are already platform
; agnostic; the only platform surface is the four-method canvas selected by
; mp_canvas.h (-DMP_PLATFORM_WATCHY picks watchy_canvas.h here).

[env:watchy2]
; PLATFORM: pioarduino (Arduino 3.1 / IDF 5.3), the same one InkWatchy uses on
; this hardware -- NOT espressif32@5.1.0 (Arduino 2.0.4 / IDF 4.4).
;
; On the older platform, NVS IS BROKEN on this ESP32-PICO-D4: nvs_set_u8()
; returns ESP_OK and the key is then NOT_FOUND on the same open handle, before
; flash is even involved, with zero entries written. Verified with a firmware
; containing nothing but NVS calls; identical test passes here. That is why
; credentials could never be provisioned.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13%%2Bgithub/platform-espressif32.zip
board = esp32dev
framework = arduino
; No platform_packages pin: the platform above brings its own Arduino 3.1 /
; IDF 5.3. Pinning the M5Paper's 2.0.4 here is what carried the NVS bug in.
board_build.partitions = huge_app.csv

; Flash mode/frequency MUST match what this board's embedded flash expects.
;
; Built and flashed at DIO/40MHz, the app's own flash WRITES were corrupted:
; NVS entry data landed correctly but the 2-bit entry-state bitmap came back as
; illegal values (0b01/0b00 instead of 0b10), so NVS skipped entries it had just
; written and every credential silently vanished. Reads were fine, which is why
; the firmware ran normally and only persistence broke.
;
; esptool writes were unaffected because they go through its own stub rather
; than the IDF flash driver, which is configured from the bootloader header --
; that asymmetry is what made this so hard to see.
;
; InkWatchy's sdkconfig has CONFIG_ESPTOOLPY_FLASHMODE_QIO=y but
; CONFIG_ESPTOOLPY_FLASHMODE="dio" -- an ESP32 quirk: the bootloader HEADER is
; written as DIO and the bootloader upgrades to QIO at runtime after reading the
; flash ID. Writing "qio" into the header instead makes this board fail to boot
; at all (verified: the app stopped executing entirely).
;
; So: DIO header, 80MHz. Mode as it always was, frequency raised to match the
; reference firmware.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 115200   ; the USB-UART bridge is unreliable above this
monitor_speed = 115200

; NOTE: do NOT set lib_ldf_mode = deep+ here. It makes the framework's own WiFi
; library fail to build ("Network.h: No such file or directory") because WiFi's
; library.properties declares no dependency on Networking and deep+ stops
; PlatformIO from wiring the framework libraries' include paths to each other.
; Reproduced on a bare project with nothing but #include <WiFi.h>.
;
; The library dependency finder only scans sources under src_dir, so the shared
; managers pulled in by build_src_filter do not by themselves pull HTTPClient /
; SPIFFS / WiFiClientSecure into the graph. main.cpp includes their headers,
; which is what puts those libraries in the graph.

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DMP_PLATFORM_WATCHY=1
	-I$PROJECT_DIR/../M5Paper_MicroPatterns/src

; Szybet/GxEPD2-watchy, not upstream zinggjm/GxEPD2. This is the fork InkWatchy
; vendors and has debugged against this exact SSD1681 / GDEH0154D67 pairing --
; it carries a first-boot grey/ghosting workaround and a border-waveform fix
; that upstream does not. Pinned to the same commit InkWatchy pins.
; Upstream was tried first and the panel never updated; with serial output
; proven useless on this device (see docs/analysis/watchy-port-attempt-log.md
; 4.2d) the display path is the remaining suspect.
lib_deps =
	https://github.com/Szybet/GxEPD2-watchy.git#1a1593255df2eae4aa163fea21f542d7c7798bd0
	; Used by the shared BLE provisioning module, not by the renderer.
	bblanchon/ArduinoJson@^7.4.1

; Shared core, compiled in place from the M5Paper tree.
build_src_filter =
	+<*>
	+<../../M5Paper_MicroPatterns/src/micropatterns_parser.cpp>
	+<../../M5Paper_MicroPatterns/src/micropatterns_runtime.cpp>
	+<../../M5Paper_MicroPatterns/src/mp_program.cpp>
	+<../../M5Paper_MicroPatterns/src/mp_browse_policy.cpp>
	+<../../M5Paper_MicroPatterns/src/micropatterns_drawing.cpp>
	+<../../M5Paper_MicroPatterns/src/matrix_utils.cpp>
	+<../../M5Paper_MicroPatterns/src/occlusion_buffer.cpp>
	+<../../M5Paper_MicroPatterns/src/display_list_renderer.cpp>
	; BLE provisioning: one implementation, both devices.
	+<../../M5Paper_MicroPatterns/src/mp_provisioning.cpp>
	; Script storage and server sync, shared with the M5Paper rather than
	; reimplemented. ScriptManager needs only SPIFFS/ArduinoJson/FreeRTOS;
	; NetworkManager holds a SystemManager* it never dereferences, so the Watchy
	; passes nullptr.
	+<../../M5Paper_MicroPatterns/src/script_manager.cpp>
	+<../../M5Paper_MicroPatterns/src/network_manager.cpp>
	+<../../M5Paper_MicroPatterns/src/script_sync.cpp>

; ---------------------------------------------------------------------------
; [env:watchy2-bench] -- per-operation / per-phase renderer benchmark.
;
; Identical hardware settings to watchy2 above, but it links NONE of the normal
; firmware: build_src_filter drops src/* and compiles the seven shared renderer
; sources plus src/bench/watchy_bench_main.cpp, which supplies its own main().
;
; That is on purpose and is the opposite of how env:m5paper-bench is wired (a
; hook inside the real setup()). No SPIFFS, no ScriptManager, no WiFi, no BLE,
; no RTC: none of it is under measurement, all of it competes for a PICO-D4's
; ~180 KB of heap, and keeping them out means this env can neither break nor be
; broken by work in progress on the normal firmware.
;
; Scripts are compiled in from src/bench/watchy_bench_corpus.h. Regenerate with
;   python3 tools/device_bench/gen_ops_corpus.py
;
; Build:   pio run -e watchy2-bench
; Flash:   pio run -e watchy2-bench -t upload
; Collect: python3 tools/device_bench/collect_watchy.py --port /dev/cu.usbserial-XXXX
[env:watchy2-bench]
extends = env:watchy2
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DMP_PLATFORM_WATCHY=1
	-DMP_BENCH=1
	-DMP_BENCH_REPS=7
	-DMP_BENCH_BUILD_TAG=\"${sysenv.MP_BENCH_TAG}\"
	-I$PROJECT_DIR/../M5Paper_MicroPatterns/src

; Only the GxEPD2 fork. ArduinoJson is a provisioning dependency and is not
; reachable from this env's sources.
lib_deps =
	https://github.com/Szybet/GxEPD2-watchy.git#1a1593255df2eae4aa163fea21f542d7c7798bd0

build_src_filter =
	-<*>
	+<bench/watchy_bench_main.cpp>
	+<../../M5Paper_MicroPatterns/src/micropatterns_parser.cpp>
	+<../../M5Paper_MicroPatterns/src/micropatterns_runtime.cpp>
	+<../../M5Paper_MicroPatterns/src/mp_program.cpp>
	+<../../M5Paper_MicroPatterns/src/micropatterns_drawing.cpp>
	+<../../M5Paper_MicroPatterns/src/matrix_utils.cpp>
	+<../../M5Paper_MicroPatterns/src/occlusion_buffer.cpp>
	+<../../M5Paper_MicroPatterns/src/display_list_renderer.cpp>

; ---------------------------------------------------------------------------
; [env:watchy2-bench-before] -- the SAME bench firmware over the renderer as it
; stood at a chosen git revision, for before/after comparison on real hardware.
;
; src/bench/before_src/ is not source under maintenance: it is a throwaway
; extraction, produced by
;     git archive <rev> M5Paper_MicroPatterns/src | tar -x
; and deleted afterwards. It is deliberately NOT a second git worktree -- a full
; checkout plus a second .pio build directory costs a few hundred MB, and the
; only thing that has to differ between the two firmwares is seven .cpp files
; and their headers.
;
; Note the include path: this env points ONLY at before_src, never at
; ../M5Paper_MicroPatterns/src. If both were on the path the old .cpp files
; would compile against the new headers, which is the subtle way a before/after
; measurement turns into nonsense.
[env:watchy2-bench-before]
extends = env:watchy2-bench
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DMP_PLATFORM_WATCHY=1
	-DMP_BENCH=1
	-DMP_BENCH_REPS=7
	-DMP_BENCH_BUILD_TAG=\"before\"
	-I$PROJECT_DIR/src/bench/before_src
build_src_filter =
	-<*>
	+<bench/watchy_bench_main.cpp>
	+<bench/before_src/*.cpp>

; ---------------------------------------------------------------------------
; Per-operation profile of the REAL scripts, on the default render path.
;
; The ops/ probes answer "what does one operation cost". They cannot answer
; "how much of it does this script contain", and guessing that wrong is how
; three separate optimisations this week got aimed at the wrong place. This
; env times every display-list item and buckets by command type.
;
; Read the numbers as a DISTRIBUTION. Two esp_timer reads per item is nothing
; against a filled circle and plenty against a PIXEL, so the run reports its own
; probe overhead and any row with a large count and a small total is suspect.
;
; Build/flash: MP_BENCH_TAG=prof pio run -e watchy2-profile -t upload
; Collect:     python3 tools/device_bench/collect_watchy.py --profile --port ...
[env:watchy2-profile]
extends = env:watchy2-bench
build_flags =
	${env:watchy2-bench.build_flags}
	-DMP_PROFILE_ITEMS=1

