; The A/B that decided the Watchy's platform.
;
; Same source, two frameworks. Run both, compare the output. See ../README.md.

[env:arduino2]
; espressif32@5.1.0 -- Arduino 2.0.4 / IDF 4.4, what the M5Paper still uses.
; On an ESP32-PICO-D4 this FAILS: set and commit both return ESP_OK and the
; very next get on the same handle returns NOT_FOUND, with zero entries used.
platform = espressif32@^5.1.0
board = esp32dev
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20004.0
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200

[env:arduino3]
; pioarduino -- Arduino 3.1 / IDF 5.3, what InkWatchy uses and what the Watchy
; firmware moved to. Identical source PASSES here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13%%2Bgithub/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200
