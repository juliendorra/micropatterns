; Proves that lib_ldf_mode = deep+ breaks the framework's OWN WiFi library on
; pioarduino. Nothing here but #include <WiFi.h>.
;
; As written: BUILD FAILS with
;   WiFiGeneric.h:44:10: fatal error: Network.h: No such file or directory
; Comment out lib_ldf_mode and it builds. See ../README.md.

[env:t]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13%%2Bgithub/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
