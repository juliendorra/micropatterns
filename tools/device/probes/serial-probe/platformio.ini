; Two independent channels in one build: the motor says the app is running, the
; serial says its UART0 reaches the host. Used to separate "the board is dead"
; from "I cannot hear it".
;
; NOTE the flash settings: this is the build that proved qio STOPS THIS BOARD
; EXECUTING ENTIRELY -- no buzz, no serial. Left as-is deliberately, as the
; record of that dead end. Change to dio to get a probe that runs.
[env:ser]
platform = espressif32@^5.1.0
board = esp32dev
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20004.0
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
