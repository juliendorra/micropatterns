; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-fire]
platform = espressif32@^5.1.0
board = m5stack-fire
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20004.0
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
lib_deps = 
	m5stack/M5EPD
	bblanchon/ArduinoJson@^7.4.1
build_src_filter =
	+<*>
	+<../../src/display_manager.cpp>
	+<../../src/event_defs.h>
	+<../../src/global_setting.cpp>
	+<../../src/input_manager.cpp>
	+<../../src/main.cpp>
	+<../../src/matrix_utils.cpp>
	+<../../src/micropatterns_command.h>
	+<../../src/micropatterns_drawing.cpp>
	+<../../src/micropatterns_parser.cpp>
	+<../../src/micropatterns_runtime.cpp>
	+<../../src/network_manager.cpp>
	+<../../src/render_controller.cpp>
	+<../../src/script_manager.cpp>
	+<../../src/system_manager.cpp>
	+<../../src/systeminit.cpp>
	+<../../src/occlusion_buffer.cpp>
	+<../../src/display_list_renderer.cpp>
; ---------------------------------------------------------------------------
; Benchmark firmware -- tier 2 of the test strategy (the on-device ground truth).
;
; Identical to [env:m5stack-fire] except for -DMP_BENCH=1 and the extra bench
; source. The default env above is bit-for-bit unaffected: every line of bench
; code lives inside `#if MP_BENCH`.
;
; Build:   pio run -e m5paper-bench
; Flash:   pio run -e m5paper-bench -t upload
; Collect: python3 tools/device_bench/collect.py --port /dev/cu.usbserial-XXXX
;
; Knobs (append to build_flags):
;   -DMP_BENCH_REPS=9        repetitions per (script, seed); default 5
;   -DMP_BENCH_PUSH=0        skip the panel push entirely (pure compute runs)
;   -DMP_BENCH_AUTOSTART_MS=0  start immediately instead of waiting for 'g'
;   -DCORE_DEBUG_LEVEL=1     quieter serial; MPBENCH| lines are unaffected
; ---------------------------------------------------------------------------
[env:m5paper-bench]
platform = espressif32@^5.1.0
board = m5stack-fire
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20004.0
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DMP_BENCH=1
	-DMP_BENCH_REPS=5
lib_deps =
	m5stack/M5EPD
	bblanchon/ArduinoJson@^7.4.1
build_src_filter =
	+<*>
	+<bench/mp_bench.cpp>
